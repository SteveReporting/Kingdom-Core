<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#05070a" />
  <title>Kingdom TV</title>
  <link rel="stylesheet" href="/tv.css" />
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="eyebrow">KINGDOM CARRIES • LIVE BROADCAST</div>
        <div class="title">KINGDOM TV</div>
      </div>
      <div class="live" id="liveState"><i></i> CONNECTING</div>
    </div>
    <div class="grid">
      <div class="card"><div class="v" id="members">—</div><div class="l">Members</div></div>
      <div class="card"><div class="v" id="queue">—</div><div class="l">Queue</div></div>
      <div class="card"><div class="v" id="parties">—</div><div class="l">Active Carries</div></div>
      <div class="card"><div class="v" id="tickets">—</div><div class="l">Open Tickets</div></div>
      <div class="card"><div class="v" id="completed">—</div><div class="l">Completed Carries</div></div>
    </div>
    <div class="ticker"><span><strong>KINGDOM NEXUS</strong> • public-safe operations feed</span><span id="updated">Waiting for first update…</span></div>
  </div>
  <script type="module" src="/tv.js"></script>
</body>
</html>
