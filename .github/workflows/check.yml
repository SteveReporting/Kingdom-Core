name: Kingdom Core Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Import UIpgrade
        run: |
          node -e "Promise.all([import('./src/commands/uipgrade.js'),import('./src/services/uiUpgrade.js'),import('./src/services/applicationLinks.js'),import('./src/ui/realmUiVNext.js')]).then(()=>console.log('UIpgrade imports OK'))"
      - name: Import carry sessions
        run: |
          node -e "import('./src/services/carryPartiesV3.js').then(()=>console.log('carry sessions import OK'))"
      - name: Import migration services
        run: |
          node -e "Promise.all([import('./src/services/setupGuild.js'),import('./src/services/preserveGuildStructure.js'),import('./src/services/setupUpgrade.js'),import('./src/services/setup2Finishing.js'),import('./src/services/setup2Ultimate.js'),import('./src/services/carryTickets.js'),import('./src/services/applicationLinks.js'),import('./src/services/ticketControlV2.js'),import('./src/services/hierarchySetup2.js')]).then(()=>console.log('migration services imports OK'))"
      - name: Import platform modules
        run: |
          node -e "Promise.all([import('./src/services/platformV4.js'),import('./src/services/platformV4Runtime.js'),import('./src/services/platformV4Interactions.js'),import('./src/services/platformV4Complete.js'),import('./src/services/platformV4Automation.js'),import('./src/services/platformV5.js'),import('./src/services/platformV10.js'),import('./src/services/realmEnginesV10.js'),import('./src/services/realmRuntimeV10.js'),import('./src/services/realmIntelligenceV10.js'),import('./src/services/realmIntelligenceRuntimeV10.js'),import('./src/services/platformApiV4.js'),import('./src/services/externalInfraV4.js'),import('./src/services/communityV4.js'),import('./src/services/securityV4.js'),import('./src/ui/kingdomV4Ui.js'),import('./src/ui/realmUiVNext.js')]).then(()=>console.log('platform imports OK'))"
      - name: UIpgrade self-test
        run: npm run selftest:uipgrade
      - name: Carry session self-test
        run: npm run selftest:carry-sessions
      - name: Approved roadmap v4 self-test
        run: npm run selftest:v4
      - name: Approved roadmap v5 self-test
        run: npm run selftest:v5
      - name: Approved roadmap v10 self-test
        run: npm run selftest:v10
